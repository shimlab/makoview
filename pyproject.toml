[project]
name = "makoview"
version = "0.2.4"
description = "Visualise the results from Mako"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.4.5",
    "fastapi>=0.128.8",
    "matplotlib>=3.9",
    "matplotlib>=3.10.5; python_version>='3.14'",
    "pydantic>=2",
    "pyfaidx>=0.9.0.4",
    "rich>=15.0.0",
    "seaborn>=0.13",
    "uvicorn[standard]>=0.39.0",
]

[project.scripts]
makoview = "makoview.main:cli"

[tool.uv]
package = true

[tool.hatch.build]
artifacts = ["backend/makoview/static"]

[tool.hatch.build.targets.wheel]
packages = ["backend/makoview"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
