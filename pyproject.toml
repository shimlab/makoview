[project]
name = "makoview"
version = "0.1.3"
description = "Visualise the results from Mako"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.1",
    "fastapi>=0.135.2",
    "pydantic>=2",
    "uvicorn[standard]>=0.42.0",
]

[project.scripts]
makoview-v2 = "backend.main:cli"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
